<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=5"
    />
    <meta name="theme-color" content="#0c0a14" />
    <link rel="icon" href="assets/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500;1,9..144,600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/app.css" />
    <title>Dashboard — Archai</title>
    <meta name="robots" content="noindex" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
    <style>
      dialog:not([open]) {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div class="ambient-layer" aria-hidden="true">
      <div class="ambient-shape ambient-shape-1"></div>
      <div class="ambient-shape ambient-shape-2"></div>
      <div class="ambient-shape ambient-shape-3"></div>
      <div class="ambient-shape ambient-shape-4"></div>
      <div class="ambient-shape ambient-shape-5"></div>
      <div class="ambient-shape ambient-shape-6"></div>
      <div class="ambient-shape ambient-shape-7"></div>
    </div>
    <div class="adm">
      <aside>
        <img src="assets/logo.png" alt="Archai" />
        <nav>
          <button data-tab="overview" data-i="overview">نظرة عامة</button>
          <button data-tab="projects" data-i="projects">المشاريع</button>
          <button data-tab="categories" data-i="categories">الأقسام</button>
          <button data-tab="analytics" data-i="analytics">الإحصائيات</button>
          <button data-tab="settings" data-i="settings">الإعدادات</button>
          <button id="out" data-i="logout">تسجيل الخروج</button>
        </nav>
      </aside>
      <div class="mn">
        <div class="tb">
          <button class="btn" id="menu" data-aria="menu" aria-label="Menu">
            ☰
          </button>
          <h1 id="ttl"></h1>
          <span class="sp"></span>
          <button
            class="btn"
            id="lang"
            data-aria="lang"
            aria-label="Switch language"
          ></button>
          <button class="btn" id="theme" data-aria="theme" aria-label="Theme">
            ◐
          </button>
        </div>
        <div id="view"></div>
      </div>
    </div>
    <script type="module" src="js/admin.js"></script>
  </body>
</html>
