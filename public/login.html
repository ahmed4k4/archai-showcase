<!doctype html><html lang="ar" dir="rtl" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="assets/logo.jpg"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/app.css"><title>Admin Login</title><meta name="robots" content="noindex"></head><body>
<main class="box login"><img src="assets/logo.jpg" alt="Archai" style="height:64px;margin:0 auto 1rem;border-radius:8px"><form id="f"><label for="em" data-i="email"></label><input id="em" type="email" autocomplete="username" required><label for="pw" data-i="pass"></label><input id="pw" type="password" autocomplete="current-password" required><div id="er" role="alert"></div><button class="btn p" data-i="login"></button></form><div class="row" style="justify-content:center"><button class="btn s" id="lang"></button><button class="btn s" id="theme">◐</button></div></main>
<script type="module">import{sb,$,boot}from'./js/core.js';boot();
if((await sb.auth.getSession()).data.session)location.replace('dashboard.html');
if(location.search.includes('denied'))$('#er').textContent='This account is not an admin.';
$('#f').onsubmit=async e=>{e.preventDefault();const b=$('button.p');b.disabled=true;const{error}=await sb.auth.signInWithPassword({email:$('#em').value,password:$('#pw').value});if(error){$('#er').textContent=error.message;b.disabled=false}else location.replace('dashboard.html')}</script></body></html>
