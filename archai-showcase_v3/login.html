<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=5"
    />
    <meta name="theme-color" content="#0c0a14" />
    <link rel="icon" href="assets/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500;1,9..144,600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/app.css" />
    <title>Admin Login — Archai</title>
    <meta name="robots" content="noindex" />
  </head>
  <body>
    <main class="box login">
      <img
        src="assets/logo.png"
        alt="Archai"
        style="height: 64px; margin: 0 auto 1rem; border-radius: 12px"
      />
      <form id="f">
        <label for="em" data-i="email">البريد الإلكتروني</label>
        <input id="em" type="email" autocomplete="username" required />
        <label for="pw" data-i="pass">كلمة المرور</label>
        <input
          id="pw"
          type="password"
          autocomplete="current-password"
          required
        />
        <div id="er" role="alert"></div>
        <button class="btn p" data-i="loginBtn" type="submit">دخول</button>
      </form>
      <div class="row" style="justify-content: center">
        <button
          class="btn s"
          id="lang"
          data-aria="lang"
          aria-label="Switch language"
        ></button>
        <button
          class="btn s"
          id="theme"
          data-aria="theme"
          aria-label="Toggle theme"
          type="button"
        >
          ◐
        </button>
      </div>
    </main>
    <script type="module">
      import { sb, $, boot, t } from "./js/core.js";
      boot();
      if ((await sb.auth.getSession()).data.session)
        location.replace("dashboard.html");
      if (location.search.includes("denied"))
        $("#er").textContent = t("loginError");
      $("#f").onsubmit = async (e) => {
        e.preventDefault();
        const b = $("button.p");
        b.disabled = true;
        const { error } = await sb.auth.signInWithPassword({
          email: $("#em").value,
          password: $("#pw").value,
        });
        if (error) {
          $("#er").textContent = error.message;
          b.disabled = false;
        } else location.replace("dashboard.html");
      };
    </script>
  </body>
</html>
