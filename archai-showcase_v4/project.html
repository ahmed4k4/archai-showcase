<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=5"
    />
    <meta name="theme-color" content="#0c0a14" />
    <link rel="icon" href="assets/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500;1,9..144,600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/light.css" />
    <title>Archai — Project</title>
  </head>
  <body>
    <div class="ambient-layer" aria-hidden="true">
      <div class="ambient-shape ambient-shape-1"></div>
      <div class="ambient-shape ambient-shape-2"></div>
      <div class="ambient-shape ambient-shape-3"></div>
      <div class="ambient-shape ambient-shape-4"></div>
      <div class="ambient-shape ambient-shape-5"></div>
      <div class="ambient-shape ambient-shape-6"></div>
      <div class="ambient-shape ambient-shape-7"></div>
    </div>
    <header class="top">
      <div class="wrap nav">
        <a href="index.html" aria-label="Archai home"
          ><img src="assets/logo.png" alt="Archai"
        /></a>
        <span class="sp"></span>
        <a class="btn" href="index.html#list" data-i="projects">المشاريع</a>
        <button
          class="btn"
          id="lang"
          data-aria="lang"
          aria-label="Switch language"
        ></button>
        <button
          class="btn"
          id="theme"
          data-aria="theme"
          aria-label="Toggle theme"
        >
          ◐
        </button>
      </div>
    </header>

    <main class="wrap" id="app"></main>

    <footer class="premium">
      <div class="wrap">
        <div class="footer-grid">
          <div class="footer-brand">
            <img
              src="assets/logo.png"
              alt="Archai"
              style="height: 48px; margin-bottom: 12px; border-radius: 10px"
            />
            <h3>Archai Integrated Systems</h3>
            <p data-i="footerAbout">
              هندسة حلول برمجية ومدمجة وموبايل بمعايير عالية. نبني أنظمة موثوقة
              لأعمال حقيقية.
            </p>
          </div>
          <div class="footer-col">
            <h4 data-i="footerLinks">الموقع</h4>
            <a href="index.html" data-i="home">الرئيسية</a>
            <a href="index.html#list" data-i="projects">المشاريع</a>
          </div>
          <div class="footer-col">
            <h4 data-i="footerContact">تواصل</h4>
            <a href="mailto:info@archai.com">info@archai.com</a>
          </div>
        </div>
        <div class="footer-bottom">
          <div data-i="footerRights">© أرشاي للأنظمة المتكاملة</div>
        </div>
      </div>
    </footer>

    <script type="module">
      import { project } from "./js/public.js";
      project();
    </script>
  </body>
</html>
